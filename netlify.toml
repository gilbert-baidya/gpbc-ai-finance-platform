[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/gpbc"
  to = "/.netlify/functions/gpbc"
  status = 200
  force = true

[[redirects]]
  from = "/api/statement-extract"
  to = "/.netlify/functions/statement-extract"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
